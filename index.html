<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>

    <!-- Link corrigido do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
    
<div id="container"> <!-- Card -->

    <form id="search">
        <i class="fa-solid fa-location-dot"></i>

        <input type="search"
               name="nome_cidade"
               id="nome_cidade"
               placeholder="Buscar cidade">


    <button type="submit">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>

  </form>
<!--Informações-->
  <div id="temperatura">  <!--Se tivesse um class="show", apareceria permanentemente-->
<h1 id="title">Curitiba, BR</h1>

<div id="infos">
    <div id="temp">
     <img id="temp_img" src="http://openweathermap.org/img/wn/04d@2x.png" alt="">

     <div>
    <p id="valor_temp"> 32 </p>
    <p id="descricao">Ensolarado</p>
     </div>

</div>

<div id="outrasinfos">
    <!--Temperatura maxima-->
    <div class="info">
        <i id="temp_max_icon" class="fa-solid fa-temperature-high"></i>
    
    <div>
        <h2>Temp. max</h2>
        <p id="temp_max"> 32 </p>
    </div>
    </div>

    <!--Temperatura mínima-->
     <div class="info">
        <i id="temp_min_icon" class="fa-solid fa-temperature-low"></i>
    
    <div>
        <h2>Temp. min</h2>
        <p id="temp_min"> 12 </p>
    </div>
    </div>
    <!--Humidade-->

     <div class="info">
        <i id="humidade_icon" class="fa-solid fa-droplet"></i>
    
    <div>
        <h2>Humidade</h2>
        <p id="humid"> 50% </p>
    </div>
    </div>

    <!--Ventos-->
     <div class="info"> 
        <i id="vento_icon" class="fa-solid fa-wind"></i>
    
    <div>
        <h2>Vento</h2>
        <p id="vento"> 50 </p>
    </div>
    </div>
</div>
</div>
</div>

<div id="alert"></div>
</div>

<!-- JAVASCRIPT -->
<script src="src/javascript/script.js">

</script>
</body>
</html>
